name: Integration Tests

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened]
    branches:
      - master
      - release/**

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      TOKEN: ${{ secrets.GLOBAL_GITHUB_TOKEN }}

    strategy:
      matrix:
        include:
          - PHP_VERSION: php74-fpm
            IMAGE: magento-project-community-edition
            IMAGE_VERSION: magento2.3.7-p4
          - PHP_VERSION: php84-fpm
            IMAGE: magento-project-community-edition
            IMAGE_VERSION: magento2.4.8-p4
            COVERAGE: true
          - PHP_VERSION: php84-fpm
            IMAGE: mage-os-community-edition
            IMAGE_VERSION: mage-os3.3.0

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Start Docker
        run: docker run --detach --name magento-project-community-edition ghcr.io/controlaltdelete-nl/magento2-in-a-box/${{ matrix.IMAGE }}:${{ matrix.PHP_VERSION }}-${{ matrix.IMAGE_VERSION }}

      - name: Upload our code into the docker container
        run: docker cp "$(pwd)" magento-project-community-edition:/data/extensions/

      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Pick repositories and branches
        id: pick
        shell: bash
        run: |
          check_branch() {
            local OWNER="$1"
            local REPO="$2"
            local BRANCH="$3"
            local DEFAULT="$4"

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/repos/$OWNER/$REPO/branches/$BRANCH")

            if [ "$STATUS" -eq 200 ]; then
              echo "$BRANCH"
            else
              echo "$DEFAULT"
            fi
          }

          OWNER="$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f1)"
          CURRENT_REPO="$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)"
          BRANCH="${{ steps.extract_branch.outputs.branch }}"
          DEFAULT="master"

          if [[ "$CURRENT_REPO" == *internal* ]]; then
            SDK_REPO="php-sdk-internal"
          else
            SDK_REPO="php-sdk"
          fi

          SDK_BRANCH=$(check_branch "$OWNER" "$SDK_REPO" "$BRANCH" "$DEFAULT")

          echo "sdk-repo=$OWNER/$SDK_REPO" >> $GITHUB_OUTPUT
          echo "sdk-branch=$SDK_BRANCH" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v5
        with:
          repository: ${{ steps.pick.outputs.sdk-repo }}
          ref: ${{ steps.pick.outputs.sdk-branch }}
          token: ${{ env.TOKEN }}
          path: php-sdk

      - name: Create directories in the container
        run: |
          docker exec --workdir /data magento-project-community-edition mkdir -p /data/extensions/php-sdk

      - name: Copy repositories into the container
        run: |
          docker cp "${{ github.workspace }}/php-sdk/." magento-project-community-edition:/data/extensions/php-sdk

      - name: Install the extension in Magento
        run: |
          docker exec --workdir /data magento-project-community-edition \
            composer require multisafepay/magento2-core \
              --no-update --no-interaction
          docker exec --workdir /data magento-project-community-edition \
            composer update multisafepay/magento2-core multisafepay/php-sdk \
              --no-interaction

      - name: Refresh Magento module registry and caches
        run: |
          docker exec --workdir /data magento-project-community-edition \
            php bin/magento module:enable MultiSafepay_ConnectCore
          docker exec --workdir /data magento-project-community-edition \
            php bin/magento cache:clean config full_page config_integration
          docker exec --workdir /data magento-project-community-edition \
            php bin/magento module:status | head -80

      - name: Install PCOV coverage driver in container
        if: matrix.COVERAGE
        run: |
          docker exec magento-project-community-edition bash -c '\
            PHPVER=$(php -r "echo PHP_MAJOR_VERSION.\".\".PHP_MINOR_VERSION;") && \
            echo "Detected PHP $PHPVER" && \
            apt-get update && \
            apt-get install -y php${PHPVER}-pcov'

      - name: Scope PCOV coverage to the extension
        if: matrix.COVERAGE
        run: |
          docker exec magento-project-community-edition bash -c '\
            PHPVER=$(php -r "echo PHP_MAJOR_VERSION.\".\".PHP_MINOR_VERSION;") && \
            printf "pcov.enabled=1\npcov.directory=/data/extensions/magento2-internal-core\n" \
              > /etc/php/${PHPVER}/cli/conf.d/99-pcov-scope.ini'
          echo "=== Effective PCOV config ==="
          docker exec magento-project-community-edition php -i | grep -i "pcov.directory"

      - name: Run tests (with coverage)
        if: matrix.COVERAGE
        run: |
          docker exec --workdir /data magento-project-community-edition \
            bash -c "cd /data/dev/tests/integration/ && \
              ../../../vendor/bin/phpunit \
              ../../../vendor/multisafepay/magento2-core/Test/Integration \
              --coverage-filter=/data/extensions/magento2-internal-core \
              --coverage-clover=/data/coverage.xml"

      - name: Copy coverage report out of the container
        if: matrix.COVERAGE
        run: docker cp magento-project-community-edition:/data/coverage.xml "${{ github.workspace }}/coverage.xml"

      - name: Send clover to Codecov
        if: matrix.COVERAGE
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: integration
          fail_ci_if_error: false

      - name: Run tests
        if: ${{ !matrix.COVERAGE }}
        run: docker exec --workdir /data magento-project-community-edition bash -c "cd /data/dev/tests/integration/ && ../../../vendor/bin/phpunit ../../../vendor/multisafepay/magento2-core/Test/Integration"
