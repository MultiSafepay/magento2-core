name: Magento 2 PHPStan

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened]
    branches:
      - master
      - release/**

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      TOKEN: ${{ secrets.GLOBAL_GITHUB_TOKEN }}

    strategy:
      matrix:
        include:
          - PHP_VERSION: php74-fpm
            IMAGE: magento-project-community-edition
            IMAGE_VERSION: magento2.3.7-p4
          - PHP_VERSION: php84-fpm
            IMAGE: magento-project-community-edition
            IMAGE_VERSION: magento2.4.8-p4
          - PHP_VERSION: php84-fpm
            IMAGE: mage-os-community-edition
            IMAGE_VERSION: mage-os3.3.0

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: module-src

      - name: Start Docker
        run: docker run --detach --name ${{ matrix.IMAGE }} ghcr.io/controlaltdelete-nl/magento2-in-a-box/${{ matrix.IMAGE }}:${{ matrix.PHP_VERSION }}-${{ matrix.IMAGE_VERSION }}

      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Pick repositories and branches
        id: pick
        shell: bash
        run: |
          set -euo pipefail

          check_branch() {
            local OWNER="$1"
            local REPO="$2"
            local BRANCH="$3"
            local DEFAULT="$4"

            local ENCODED_BRANCH
            ENCODED_BRANCH=$(jq -rn --arg b "$BRANCH" '$b|@uri')

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/repos/$OWNER/$REPO/branches/$ENCODED_BRANCH")

            if [ "$STATUS" -eq 200 ]; then
              echo "$BRANCH"
            else
              echo "$DEFAULT"
            fi
          }

          OWNER="$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f1)"
          CURRENT_REPO="$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)"
          BRANCH="${{ steps.extract_branch.outputs.branch }}"
          DEFAULT="master"

          if [[ "$CURRENT_REPO" == *internal* ]]; then
            SDK_REPO="php-sdk-internal"
            CORE_REPO="magento2-internal-core"
          else
            SDK_REPO="php-sdk"
            CORE_REPO="magento2-core"
          fi

          SDK_BRANCH=$(check_branch "$OWNER" "$SDK_REPO" "$BRANCH" "$DEFAULT")
          CORE_BRANCH=$(check_branch "$OWNER" "$CORE_REPO" "$BRANCH" "$DEFAULT")

          case "$CURRENT_REPO" in
            magento2-internal-core) MODULE_PACKAGE="multisafepay/magento2-core" ;;
            magento2-core)           MODULE_PACKAGE="multisafepay/magento2-core" ;;
            *)                       MODULE_PACKAGE="multisafepay/$CURRENT_REPO" ;;
          esac

          echo "sdk-repo=$OWNER/$SDK_REPO"        >> $GITHUB_OUTPUT
          echo "sdk-branch=$SDK_BRANCH"           >> $GITHUB_OUTPUT
          echo "core-repo=$OWNER/$CORE_REPO"      >> $GITHUB_OUTPUT
          echo "core-branch=$CORE_BRANCH"         >> $GITHUB_OUTPUT
          echo "current-repo=$CURRENT_REPO"       >> $GITHUB_OUTPUT
          echo "module-package=$MODULE_PACKAGE"   >> $GITHUB_OUTPUT

      - name: Checkout PHP-SDK
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pick.outputs.sdk-repo }}
          ref: ${{ steps.pick.outputs.sdk-branch }}
          token: ${{ env.TOKEN }}
          path: php-sdk-src

      - name: Checkout Magento 2 Core (companion)
        if: ${{ steps.pick.outputs.current-repo != 'magento2-core' && steps.pick.outputs.current-repo != 'magento2-internal-core' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pick.outputs.core-repo }}
          ref: ${{ steps.pick.outputs.core-branch }}
          token: ${{ env.TOKEN }}
          path: magento2-core-src

      - name: Create package-source directories in the container
        run: |
          docker exec ${{ matrix.IMAGE }} mkdir -p /data/package-source/multisafepay/magento2-core
          docker exec ${{ matrix.IMAGE }} mkdir -p /data/package-source/multisafepay/php-sdk

      - name: Copy the current module into the container as a path package
        run: |
          if [ "${{ steps.pick.outputs.current-repo }}" = "magento2-core" ] || \
             [ "${{ steps.pick.outputs.current-repo }}" = "magento2-internal-core" ]; then
            docker cp "${{ github.workspace }}/module-src/." ${{ matrix.IMAGE }}:/data/package-source/multisafepay/magento2-core
          else
            docker exec ${{ matrix.IMAGE }} mkdir -p /data/package-source/multisafepay/${{ steps.pick.outputs.current-repo }}
            docker cp "${{ github.workspace }}/module-src/."      ${{ matrix.IMAGE }}:/data/package-source/multisafepay/${{ steps.pick.outputs.current-repo }}
            docker cp "${{ github.workspace }}/magento2-core-src/." ${{ matrix.IMAGE }}:/data/package-source/multisafepay/magento2-core
          fi

      - name: Copy PHP-SDK into the container as a path package
        run: docker cp "${{ github.workspace }}/php-sdk-src/." ${{ matrix.IMAGE }}:/data/package-source/multisafepay/php-sdk

      - name: Allow composer plugins
        run: docker exec --workdir /data ${{ matrix.IMAGE }} composer config --no-plugins allow-plugins true

      - name: Disable Composer audit blocking
        run: docker exec --workdir /data ${{ matrix.IMAGE }} composer config audit.block-insecure false

      - name: Register MultiSafepay path repositories
        run: docker exec --workdir /data ${{ matrix.IMAGE }} composer config repositories.multisafepay path "package-source/multisafepay/*"

      - name: Require the module from the local path repo
        run: docker exec --workdir /data ${{ matrix.IMAGE }} composer require ${{ steps.pick.outputs.module-package }}:* --no-update --no-interaction

      - name: Install PHPStan and Magento extension (deferred install)
        run: |
          docker exec --workdir /data ${{ matrix.IMAGE }} composer require --dev phpstan/extension-installer --no-update --no-interaction

          if [ "${{ matrix.PHP_VERSION }}" = "php74-fpm" ]; then
            docker exec --workdir /data ${{ matrix.IMAGE }} composer require --dev phpstan/phpstan:^1.12 --no-update --no-interaction
            docker exec --workdir /data ${{ matrix.IMAGE }} composer require --dev bitexpert/phpstan-magento:0.32.0 --no-update --no-interaction
          else
            docker exec --workdir /data ${{ matrix.IMAGE }} composer require --dev phpstan/phpstan:2.2.9 --no-update --no-interaction
            docker exec --workdir /data ${{ matrix.IMAGE }} composer require --dev bitexpert/phpstan-magento:^0.43.0 --no-update --no-interaction
          fi

      - name: Install composer dependencies
        shell: bash
        run: |
          set -euo pipefail

          # The base images are rebuilt upstream and may lock packages (e.g. rector/rector)
          # that require a newer phpstan/phpstan than the one pinned above.
          # Allow every locked package depending on phpstan/phpstan to be up/downgraded.
          ROOT_NAME=$(docker exec --workdir /data ${{ matrix.IMAGE }} composer config name 2>/dev/null || true)
          PHPSTAN_DEPENDENTS=$(docker exec --workdir /data ${{ matrix.IMAGE }} composer depends phpstan/phpstan --locked 2>/dev/null \
            | awk '/ requires /{print $1}' \
            | grep '/' \
            | grep -vx "${ROOT_NAME:-__none__}" \
            | sort -u | tr '\n' ' ' || true)
          echo "Locked packages depending on phpstan/phpstan: ${PHPSTAN_DEPENDENTS:-none}"

          docker exec --workdir /data ${{ matrix.IMAGE }} composer update \
            multisafepay/magento2-core \
            phpstan/extension-installer \
            phpstan/phpstan \
            bitexpert/phpstan-magento \
            ${PHPSTAN_DEPENDENTS} \
            --with-all-dependencies \
            --no-interaction

      - name: Show installed PHPStan versions
        run: docker exec --workdir /data ${{ matrix.IMAGE }} composer show phpstan/phpstan bitexpert/phpstan-magento | cat


      - name: Run PHPStan
        run: docker exec --workdir /data ${{ matrix.IMAGE }} vendor/bin/phpstan analyse -c vendor/multisafepay/magento2-core/phpstan.neon --error-format table --no-progress
