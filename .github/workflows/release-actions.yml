name: Release Actions
on:
  pull_request:
    branches:
      - master
    types: [closed]

defaults:
  run:
    shell: bash

jobs:
  build:
    if: ${{ github.event.pull_request.merged == true && contains(github.head_ref, 'release/') && !contains(github.head_ref, 'revert') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      TOKEN: ${{ secrets.GLOBAL_GITHUB_TOKEN }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - PHP_VERSION: php74-fpm
            IMAGE: magento-project-community-edition
            IMAGE_VERSION: magento2.3.7-p4
          - PHP_VERSION: php84-fpm
            IMAGE: magento-project-community-edition
            IMAGE_VERSION: magento2.4.8-p4
            COVERAGE: true
          - PHP_VERSION: php84-fpm
            IMAGE: mage-os-community-edition
            IMAGE_VERSION: mage-os3.3.0

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Start Docker
        run: docker run --detach --name ${{ matrix.IMAGE }} ghcr.io/controlaltdelete-nl/magento2-in-a-box/${{ matrix.IMAGE }}:${{ matrix.PHP_VERSION }}-${{ matrix.IMAGE_VERSION }}

      - name: Upload our code into the docker container
        run: docker cp "$(pwd)" ${{ matrix.IMAGE }}:/data/extensions/

      - name: Extract branch name
        id: extract_branch
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Pick repositories and branches
        id: pick
        run: |
          check_branch() {
            local OWNER="$1"
            local REPO="$2"
            local BRANCH="$3"
            local DEFAULT="$4"

            # URL-encode the branch name so refs containing "/" (e.g. release/1.2) work
            local ENCODED_BRANCH
            ENCODED_BRANCH=$(jq -rn --arg b "$BRANCH" '$b|@uri')

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/repos/$OWNER/$REPO/branches/$ENCODED_BRANCH")

            if [ "$STATUS" -eq 200 ]; then
              echo "$BRANCH"
            else
              echo "$DEFAULT"
            fi
          }

          OWNER="$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f1)"
          CURRENT_REPO="$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)"
          BRANCH="${{ steps.extract_branch.outputs.branch }}"
          DEFAULT="master"

          if [[ "$CURRENT_REPO" == *internal* ]]; then
            SDK_REPO="php-sdk-internal"
          else
            SDK_REPO="php-sdk"
          fi

          SDK_BRANCH=$(check_branch "$OWNER" "$SDK_REPO" "$BRANCH" "$DEFAULT")

          echo "sdk-repo=$OWNER/$SDK_REPO" >> $GITHUB_OUTPUT
          echo "sdk-branch=$SDK_BRANCH" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v5
        with:
          repository: ${{ steps.pick.outputs.sdk-repo }}
          ref: ${{ steps.pick.outputs.sdk-branch }}
          token: ${{ env.TOKEN }}
          path: php-sdk

      - name: Create directories in the container
        run: |
          docker exec ${{ matrix.IMAGE }} mkdir -p /data/extensions/php-sdk

      - name: Copy repositories into the container
        run: |
          docker cp "${{ github.workspace }}/php-sdk/." ${{ matrix.IMAGE }}:/data/extensions/php-sdk

      - name: Install the extension in Magento
        run: docker exec ${{ matrix.IMAGE }} composer require multisafepay/magento2-core

      - name: Run tests
        run: docker exec ${{ matrix.IMAGE }} bash -c "cd /data/dev/tests/integration/ && ../../../vendor/bin/phpunit ../../../vendor/multisafepay/magento2-core/Test/Integration"

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ success() && github.event.pull_request.merged == true && contains(github.head_ref, 'release/') && !contains(github.head_ref, 'revert') }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get Release Version
        id: version
        run: |
          VERSION=$(jq -r .version composer.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: tag_check
        run: |
          TAG_EXISTS=$(git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.version }}" | wc -l)
          if [ "$TAG_EXISTS" -gt 0 ]; then
            echo "Tag already exists. Skipping release."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if tag exists
        if: ${{ steps.tag_check.outputs.skip == 'true' }}
        run: exit 0

      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          validation_depth: 10
          version: ${{ steps.version.outputs.version }}
          path: ./CHANGELOG.md

      - name: Create Release
        id: create_release
        uses: actions/create-release@latest
        if: ${{ steps.tag_check.outputs.skip == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog_reader.outputs.changes }}
          draft: false
          prerelease: false
